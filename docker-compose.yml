version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: payroll_postgres
    restart: always
    environment:
      POSTGRES_USER: payroll_user
      POSTGRES_PASSWORD: PayrollSecurePassword123!
      POSTGRES_DB: enterprise_payroll
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payroll_user -d enterprise_payroll"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: payroll_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://payroll_user:PayrollSecurePassword123!@postgres:5432/enterprise_payroll
      JWT_SECRET: SuperSecretPayrollEnterpriseJWTKey2026!
      CORS_ORIGINS: "http://localhost,http://localhost:80,http://localhost:3000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: payroll_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
